server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Any route that doesn't have a file extension (e.g. /dine-in)
    # should be redirected to index.html to let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container (if applicable in production network)
    # This matches the Vite proxy configuration
    location /api/ {
        # The backend URL should be injected/configured via environment variables or Docker networking
        # Example: proxy_pass http://backend:8001;
        
        # Note: If your API is hosted elsewhere publicly, you can remove this block 
        # and just configure VITE_API_URL in your React env file during build.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://dev-api.dataudipi.com; 
    }

    location /static/ {
        proxy_pass http://dev-api.dataudipi.com;
    }
}
